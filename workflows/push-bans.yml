name: Push bans to the website

# WHY THIS EXISTS
#   The website's host blocks every outbound connection, so the site can never
#   read the game database. This flips the direction: every few minutes a
#   GitHub runner reads fury_bans and POSTs it to the site's /api/bans.php.
#   Nothing is installed on the game server or the website.

on:
  schedule:
    - cron: "*/5 * * * *"
  # Lets you run it by hand from the Actions tab. On a private repository
  # GitHub also disables scheduled runs after 60 days without commits, so
  # having a normal push trigger keeps the schedule alive.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: push-bans
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install PyMySQL cryptography

      - name: Push bans
        env:
          # Runner IP is a datacentre IP, so the site's anti-bot proxy will
          # challenge it. cryptography lets push_bans.py solve that itself.
          BANS_DB_HOST: iota.optiklink.com
          BANS_DB_USER: ${{ secrets.BANS_DB_USER }}
          BANS_DB_PASS: ${{ secrets.BANS_DB_PASS }}
          BANS_DB_NAME: ${{ secrets.BANS_DB_NAME }}
          BANS_INGEST_KEY: ${{ secrets.BANS_INGEST_KEY }}
        run: python push_bans.py
